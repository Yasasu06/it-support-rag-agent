# CI: fast unit tests on every push / PR to main.
#
# Design decision — this workflow runs the ENTIRE tests/ directory (so new test
# files are picked up automatically) EXCEPT tests/test_integration.py, because
# those tests make real OpenAI API calls. Running them in CI would require exposing
# OPENAI_API_KEY as a GitHub Actions secret and would incur real API cost on
# every push. Skipping them here is a common, reasonable real-world tradeoff:
# the fast suite runs for main-branch push and pull-request events, while integration tests
# can be run explicitly in an environment with the required API key.
#
# The pinned spaCy model is installed with requirements.txt before tests run.

name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -c "import spacy; spacy.load('en_core_web_sm')"

      - name: Run fast unit tests (no API key required)
        run: |
          python -m pytest tests/ -v --ignore=tests/test_integration.py

      - name: Report test summary
        if: always()
        run: |
          echo "Fast tests completed for this main-branch workflow event without external API calls"
